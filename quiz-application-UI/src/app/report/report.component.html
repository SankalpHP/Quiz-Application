<app-navbar></app-navbar>
<div class="container">
    <div class="row">
      <div class="col">
          <div class="card mb-2">
              <div class="card-body" style="font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif">
                <h5>Exam Attempted by you</h5> 
              </div>
          </div>
      </div>
      
        <div class="col-lg-12">
            <div class="table-responsive">
                <table class="table align-middle table-bordered">
                    <thead>
                      <tr style="text-align: center;">
                        <th>Exam Name</th>
                        <th>Category</th>
                        <th>Subcategory</th>
                        <th>Exam Duration</th>
                        <th>Details</th>
                      </tr>
                    </thead>
                    <tbody style="text-align: center;">
                       @if(attemptedExam != undefined){
                          @for (attempted of attemptedExam; track $index) {
                            <tr>
                                <td>{{attempted.examName}}</td>
                                <td>{{attempted.category}}</td>
                                <td>{{attempted.subcategory}}</td>
                                <td>{{attempted.examDuration}}</td>
                                <td><button class="btn btn-outline-danger" [routerLink]="['/details',attempted.examId]">view</button></td>
                            </tr>
                          }
                      }
                    </tbody>
                  </table>
            </div>
        </div>
    </div>
</div>
